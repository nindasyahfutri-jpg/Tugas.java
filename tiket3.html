<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Tiket Kapal</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Stepper / Navigasi Langkah */
        .stepper {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #f8f9fa;
            border-radius: 6px;
            overflow: hidden;
        }

        .step {
            flex: 1;
            padding: 12px 15px;
            font-size: 14px;
            text-align: center;
            color: #666;
            background: #e9ecef;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s, color 0.3s;
        }

        .step.active {
            background: #1a252f;
            color: #fff;
            font-weight: bold;
        }

        .step:hover:not(.active) {
            background: #dee2e6;
        }

        /* Tampilan Form per Langkah */
        .step-content {
            display: none;
        }

        .step-content.active {
            display: block;
        }

        /* Forms & Sections */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .card {
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #fff;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
        }

        .form-group.small {
            flex: 0.5;
            min-width: 120px;
        }

        label {
            font-size: 12px;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span {
            position: absolute;
            left: 10px;
            color: #888;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%;
            padding: 8px 10px 8px 30px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background-color: #fff;
        }

        input:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #999;
        }

        select {
            padding-left: 30px;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23555" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 18px;
        }

        /* Tombol Toggle Sekali Jalan / Pulang Pergi */
        .btn-toggle-group {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .btn-toggle {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-toggle.active {
            background: #1a252f;
            color: #fff;
            border-color: #1a252f;
            font-weight: bold;
        }

        /* Navigation Buttons */
        .btn-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #1a252f;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Title -->
    <div class="header-title">
        🚢 Pemesanan Tiket Kapal
    </div>

    <!-- Stepper Navigasi Utama -->
    <div class="stepper">
        <div class="step active" id="step-tab-1" onclick="goToStep(1)">1. Pilih Rute & Jadwal</div>
        <div class="step" id="step-tab-2" onclick="goToStep(2)">2. Data Penumpang</div>
        <div class="step" id="step-tab-3" onclick="goToStep(3)">3. Pilih Tempat Duduk</div> </div>

    <!-- LANGKAH 1: PILIH RUTE & JADWAL -->
    <div class="step-content active" id="step-content-1">
        <div class="section-title">Pencarian Tiket</div>
        <div class="card">
            <!-- Toggle Sekali Jalan / Pulang Pergi -->
            <div class="btn-toggle-group">
                <button type="button" class="btn-toggle active" id="btn-sekali-jalan" onclick="setTripType('sekali')">Sekali Jalan</button>
                <button type="button" class="btn-toggle" id="btn-pulang-pergi" onclick="setTripType('pulang-pergi')">Pulang Pergi</button></div>

            <div class="form-row">
                <div class="form-group">
                    <label>Pelabuhan Asal</label>
                    <div class="input-wrapper">
                        <span>⚓</span>
                        <select>
                            <option value="">Pilih Pelabuhan Asal</option>
                            <option>Tanjung Priok</option>
                            <option>Merak</option>
                            <option>Bakauheni</option> </select></div></div>

                <div class="form-group">
                    <label>Pelabuhan Tujuan</label>
                    <div class="input-wrapper">
                        <span>⚓</span>
                        <select>
                            <option value="">Pilih Pelabuhan Tujuan</option>
                            <option>Tanjung Perak</option>
                            <option>Gilimanuk</option>
                            <option>Ketapang</option></select> </div></div>

                <div class="form-group">
                    <label>Tanggal Keberangkatan</label>
                    <div class="input-wrapper">
                        <span>📅</span>
                        <input type="date"> </div></div>

                <div class="form-group">
                    <label>Tanggal Kembali</label>
                    <div class="input-wrapper">
                        <span>📅</span>
                        <input type="date" id="input-tanggal-kembali" disabled placeholder="(one-way) Kembali"> </div> </div>
          
        <div class="btn-navigation">
            <div></div>
            <button class="btn btn-primary" onclick="goToStep(2)">Lanjut ke Data Penumpang &rarr;</button></div></div>

    <!-- LANGKAH 2: DATA PENUMPANG -->
    <div class="step-content" id="step-content-2">
        <!-- Data Pemesan -->
        <div class="card">
            <div class="card-title">Data Pemesan</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Nama Lengkap *</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <input type="text" placeholder="Nama Lengkap"></div></div>

                <div class="form-group">
                    <label>No. Handphone</label>
                    <div class="input-wrapper">
                        <span>📱</span>
                        <input type="text" placeholder="No. Handphone"></div></div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <span>✉️</span>
                        <input type="email" placeholder="Email (e.g., example@email.com)"></div></div>

        <!-- Data Penumpang 1 -->
        <div class="card">
            <div class="card-title">Data Penumpang 1</div>
            <div class="form-row">
                <div class="form-group small">
                    <label>Panggilan</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <select>
                            <option>Tuan</option>
                            <option>Nyonya</option>
                            <option>Nona</option> </select> </div> </div>

                <div class="form-group">
                    <label>Nama Lengkap (sesuai KTP/Paspor)</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <input type="text" placeholder="Nama Lengkap (sesuai KTP/Paspor)">
                    </div>
                </div>
                <div class="form-group">
                    <label>Jenis Identitas *</label>
                    <div class="input-wrapper">
                        <span>🪪</span>
                        <select>
                            <option>KTP</option>
                            <option>Paspor</option>
                            <option>SIM</option> </select></div> </div>

            <div class="form-row">
                <div class="form-group">
                    <label>No. Identitas</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <input type="text" placeholder="No. Identitas"></div> </div>
                        
                <div class="form-group">
                    <label>Tanggal Lahir</label>
                    <div class="input-wrapper">
                        <span>📅</span>
                        <input type="date">
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Penumpang 2 -->
        <div class="card">
            <div class="card-title">Data Penumpang 2</div>
            <div class="form-row">
                <div class="form-group small">
                    <label>Panggilan</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <select>
                            <option>Tuan</option>
                            <option>Nyonya</option>
                            <option>Nona</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <input type="text" placeholder="Nama Lengkap">
                    </div>
                </div>
                <div class="form-group">
                    <label>Jenis Identitas</label>
                    <div class="input-wrapper">
                        <span>🪪</span>
                        <select>
                            <option>KTP</option>
                            <option>Paspor</option>
                            <option>SIM</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>No. Identitas</label>
                    <div class="input-wrapper">
                        <span>👤</span>
                        <input type="text" placeholder="No. Identitas">
                    </div>
                </div>
                <div class="form-group">
                    <label>Tanggal Lahir</label>
                    <div class="input-wrapper">
                        <span>📅</span>
                        <input type="date">
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-navigation">
            <button class="btn btn-secondary" onclick="goToStep(1)">&larr; Kembali</button>
            <button class="btn btn-primary" onclick="goToStep(3)">Lanjut ke Pilih Tempat Duduk &rarr;</button>
        </div>
    </div>

    <!-- LANGKAH 3: PILIH TEMPAT DUDUK -->
    <div class="step-content" id="step-content-3">
        <div class="section-title">Pilih Tempat Duduk</div>
        <div class="card">
            <p style="text-align: center; color: #666; padding: 20px 0;">
                💺 Silakan pilih nomor kursi tempat duduk penumpang di denah yang tersedia.
            </p>
        </div>
        <div class="btn-navigation">
            <button class="btn btn-secondary" onclick="goToStep(2)">&larr; Kembali</button>
            <button class="btn btn-primary" onclick="alert('Pemesanan Tiket Berhasil!')">Konfirmasi Pemesanan</button>
        </div>
    </div>

</div>

<script>
    
    function setTripType(type) {
        const btnSekali = document.getElementById('btn-sekali-jalan');
        const btnPP = document.getElementById('btn-pulang-pergi');
        const inputKembali = document.getElementById('input-tanggal-kembali');

        if (type === 'pulang-pergi') {
            btnPP.classList.add('active');
            btnSekali.classList.remove('active');
            inputKembali.disabled = false; // Aktifkan input tanggal kembali
        } else {
            btnSekali.classList.add('active');
            btnPP.classList.remove('active');
            inputKembali.disabled = true;  // Matikan input tanggal kembali
            inputKembali.value = '';
        }
    }

    function goToStep(stepNumber) {
       
        for (let i = 1; i <= 3; i++) {
            document.getElementById('step-content-' + i).classList.remove('active');
            document.getElementById('step-tab-' + i).classList.remove('active');
        }

        document.getElementById('step-content-' + stepNumber).classList.add('active');
        document.getElementById('step-tab-' + stepNumber).classList.add('active');
    }
</script>

</body>
</html>
