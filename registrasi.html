<!DOCTYPE html>

<body>
    <h1>Form Pendaftaran Akun Game</h1>
    <form action="">

        <!-- username untuk didalam game -->
        <p>
            <label for="nickname/game ID">Nickname / Game ID:</label>
            <input type="text"/>
        </p>

        <!-- email untuk pemulihan akun -->
         <p>
            <label for="emailakun">Email Akun:</label>
            <input type="email"/>
         </p>

         <!-- password untuk login -->
          <p>
            <label for="password">Password : </label>
            <input type="password" />
          </p>

          <!-- pilihan faksi atau kelas karakter -->
           <p>
            <label for="pilih kelas karakter">Pilih Kelas karakter :</label>
            <select name="" id="">
                <option value="#"> =---PILIH HERO---=</option>
                <OPtion value="Warrior">Warrior(pertarungan)</OPtion>
                <option value="Mage">Mage(penyihir)</option>
                <option value="Assassin">Assassin(lincah)</option>
            </select>
           </p>

           <!-- Tombol untuk mendaftar -->
            <input type="submit" value="Buat Akun & Main!" />
            <input type="reset" value="Reset" />


    </form>
</body>
</html>
