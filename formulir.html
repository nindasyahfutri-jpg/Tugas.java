<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="mulir.css">
</head>
<body>
    
    <h1>Formulir Pendaftaran Siswa</h1>
    <form action="#">
        <!-- inputan text -->
         <label for="#">Nama Calon Siswa  : </label>
         <input type="text"><br /><br />

         <!-- tombol tanggal -->
          <label for=" tempattanggal">Tempat/Tanggal Lahir:</label>
          <input type="text">
          <input type="date"><br /><br />

          <!-- select agama -->
           <label for="">Agama :</label>
         <select name="agama" id="">
          <option value="islam">Islam</option>
          <option value="budha">Budha</option>
          <option value="katolik">Katolik</option>
          <option value="kristen">Kristen</option>
          <option value="hindu">Hindu</option>
          <option value="konghucu">Konghucu</option><br />
         </select><br /><br />

         <!-- tect area -->
          <label for="alamat">Alamat :  </label><br />
          <textarea name="" id="" rows="5" cols="30" style="text-align:center" ></textarea><br /><br />

          <!-- spinner -->
          <label for="nomor">Nomor Telepon :</label>
          <input type="number"><br /><br /><br />

          <!-- input radio -->
           <label for="#">Jenis Kelamin :</label>
           <input type="radio" name="jk" />
           <label for="#">Perempuan</label>
           <input type="radio" name="jk" />
           <label for="#">Laki-laki</label><br /><br />

           <label for="#">Hobi :</label>
           <input type="radio" name="" />
           <label for="#">Membaca</label>
           <input type="radio">
           <label for="#">Menulis</label>
           <input type="radio">
           <label for="#">Olahraga</label><br /><br />

           <!-- input file -->
            <label for="file">Pas Foto :</label>
            <input type="file" /> <br /><br />

            <!-- Tombol Submit -->
             <input type="submit" value="Kirim" />

    </form>
    
</body>
</html>
